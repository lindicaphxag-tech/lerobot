name: Validate ACT relative actions

on:
  push:
    branches:
      - "validation/act-relative-action-support"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused LeRobot test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff
      - name: Run ACT processor tests
        run: python -m pytest -q tests/processor/test_act_processor.py
      - name: Lint changed files
        run: |
          ruff check             src/lerobot/policies/act/configuration_act.py             src/lerobot/policies/act/processor_act.py             tests/processor/test_act_processor.py
