name: Independent PR4862 online extra-conditioning failure reproduction
on:
  push:
    branches: ["validation/pr4862-online-extra-conditioning-falsifier-20261013"]
    paths:
      - "tests/policies/test_diffusion_hooks_online_review_regression.py"
      - ".github/workflows/verify-pr4862-online-hooks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-hook-online-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual LeRobot diffusion CPU requirements
        run: python -m pip install -e ".[test,diffusion]"
      - name: Confirm original upstream diff hook tests pass on same source
        run: python -m pytest -q tests/policies/test_diffusion_hooks.py
      - name: Independently reproduce missing online input while training succeeds
        run: python -m pytest -q tests/policies/test_diffusion_hooks_online_review_regression.py
