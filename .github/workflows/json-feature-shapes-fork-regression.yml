name: LeRobot dataset JSON shapes - targeted fork regression
on:
  push:
    branches:
      - fix/json-shape-normalization-frame-validation-20261014
    paths:
      - src/lerobot/datasets/feature_utils.py
      - tests/datasets/test_json_feature_shapes.py
      - .github/workflows/json-feature-shapes-fork-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numpy-shape-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LeRobot dataset metadata dependencies
        run: python -m pip install -e '.[dataset]' pytest
      - name: Check JSON-normalized state, action and scalar feature regressions
        run: python -m pytest -q tests/datasets/test_json_feature_shapes.py
