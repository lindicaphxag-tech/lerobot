name: Review LeRobot #4862 online extra-conditioning queue green prototype
on:
  push:
    branches: ["validation/pr4862-online-extra-conditioning-fix-20261013"]
    paths:
      - "src/lerobot/policies/diffusion/modeling_diffusion.py"
      - "tests/policies/test_diffusion_hooks_online_review_regression.py"
      - ".github/workflows/verify-pr4862-online-hook-fix.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  green-original-and-online-review:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LeRobot diffusion CPU requirements
        run: python -m pip install -e ".[test,diffusion]"
      - name: Run existing original PR hooks and online extra-input contract
        run: python -m pytest -q tests/policies/test_diffusion_hooks.py tests/policies/test_diffusion_hooks_online_review_regression.py
